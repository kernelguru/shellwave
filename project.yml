name: Shellwave
options:
  bundleIdPrefix: de.marck
  deploymentTarget:
    iOS: "26.0"
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.99.3
  swift-nio-ssh:
    # derselbe Fork, den Citadel nutzt (Zertifikats-Login)
    url: https://github.com/Wellz26/swift-nio-ssh
    minorVersion: 0.3.4
  swift-nio:
    url: https://github.com/apple/swift-nio
    from: 2.81.0
targets:
  Shellwave:
    type: application
    platform: iOS
    sources:
      - Shellwave
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
    scheme: {}
    info:
      path: Shellwave/Info.plist
      properties:
        CFBundleDisplayName: Shellwave
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Shellwave verbindet sich per SSH mit Servern und mit deinem UCM im lokalen Netzwerk.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.marck.shellwave
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
