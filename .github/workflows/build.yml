name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass benötigt das iOS-26-SDK (Xcode 26)
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Shellwave.xcodeproj \
            -scheme Shellwave \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Shellwave.app Payload/
          # Statische Frameworks (mosh, protobuf) sind schon ins Binary gelinkt und
          # dürfen nicht im Bundle landen, sonst lehnt iOS die Installation ab.
          ls -la Payload/Shellwave.app/Frameworks/*.framework || true
          file Payload/Shellwave.app/Frameworks/*.framework/* || true
          rm -rf Payload/Shellwave.app/Frameworks/mosh.framework Payload/Shellwave.app/Frameworks/Protobuf_C_.framework
          rmdir Payload/Shellwave.app/Frameworks 2>/dev/null || true
          echo "--- Bundle-Inhalt ---"
          find Payload/Shellwave.app -maxdepth 2 | sort
          du -sh Payload/Shellwave.app
          zip -qry Shellwave-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shellwave-unsigned-ipa
          path: Shellwave-unsigned.ipa

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Shellwave-unsigned.ipa
