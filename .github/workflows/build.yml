name: Build unsigned IPA

on:
  push:
    branches: [main, netbird-poc]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass benötigt das iOS-26-SDK (Xcode 26)
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Show Xcode version
        run: xcodebuild -version

      # NetBird-Client (Go) als iOS-Framework – nur im Branch netbird-poc
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Build NBKit.xcframework (NetBird)
        working-directory: poc/nbkit
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          go get golang.org/x/mobile/bind
          go mod tidy
          gomobile bind -target ios -iosversion 17.0 -ldflags="-s -w" -o NBKit.xcframework .
          du -sh NBKit.xcframework

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Shellwave.xcodeproj \
            -scheme Shellwave \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Shellwave.app Payload/
          echo "--- Bundle-Inhalt ---"
          find Payload/Shellwave.app -maxdepth 2 | sort
          du -sh Payload/Shellwave.app
          zip -qry Shellwave-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shellwave-unsigned-ipa
          path: Shellwave-unsigned.ipa

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Shellwave-unsigned.ipa
