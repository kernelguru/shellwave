name: Testbuild Xcode 27 (Preview)

# Nur manuell: prüft, ob die App mit Xcode 27 / iOS-27-SDK baut.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.2"

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Build NBKit.xcframework (NetBird)
        working-directory: poc/nbkit
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          ./prepare-netbird.sh
          go get golang.org/x/mobile/bind
          go mod tidy
          gomobile bind -target ios -iosversion 17.0 -ldflags="-s -w" -o NBKit.xcframework .
          du -sh NBKit.xcframework

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Shellwave.xcodeproj \
            -scheme Shellwave \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Shellwave.app Payload/
          echo "--- Bundle-Inhalt ---"
          find Payload/Shellwave.app -maxdepth 2 | sort
          du -sh Payload/Shellwave.app
          zip -qry Shellwave-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shellwave-xcode27-test
          path: Shellwave-unsigned.ipa
